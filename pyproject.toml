[project]
name = "aia"
version = "0.1.0"
description = "Local-first, multi-tenant two-agent personal assistant (Business + Health) with WhatsApp as the primary interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AIA" }]

dependencies = [
  # --- Web / service layer ---
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  # --- Config & validation ---
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  # --- Persistence ---
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.2.5",
  # --- Cache / event bus / short-term memory ---
  "redis>=5.0",
  # --- LLM routing (local Ollama + cloud fallback) ---
  "litellm>=1.40",
  # --- Agent workflows / state machines ---
  "langgraph>=0.1.5",
  "langchain-core>=0.2",
  # --- Integrations ---
  "httpx>=0.27",
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
  "msal>=1.28",            # Microsoft Graph (Outlook / M365)
  "twilio>=9.0",           # Phone calling
  # --- Security ---
  "cryptography>=42.0",    # Fernet envelope encryption
  "keyring>=24.3",         # OS keychain master key storage
  # --- Ops ---
  "structlog>=24.1",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
aia-business = "aia.agents.business.service:main"
aia-health = "aia.agents.health.service:main"
aia-gateway = "aia.gateway.main:main"
aia-onboarding = "aia.onboarding.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

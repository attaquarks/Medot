name: medot-ci

on:
  push:
    branches: [main]
    paths: ["runtime/**", "supabase/**", "desktop/**", "bridges/**", ".github/workflows/medot-ci.yml"]
  pull_request:
    paths: ["runtime/**", "supabase/**", "desktop/**", "bridges/**", ".github/workflows/medot-ci.yml"]

jobs:
  runtime:
    name: Runtime tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests (integration tests skip without a Supabase stack)
        run: uv run --extra dev pytest tests/ -q
      - name: Lint
        run: uv run --extra dev ruff check medot tests

  supabase:
    name: Supabase migrations + RLS suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local stack (applies migrations; idempotency = re-run)
        working-directory: supabase
        run: |
          supabase start
          supabase db reset
      - name: Export local-stack keys for tests (generated at runtime, never committed)
        working-directory: supabase
        run: |
          status=$(supabase status -o env)
          echo "MEDOT_TEST_SUPABASE_URL=$(echo "$status" | grep '^API_URL=' | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "MEDOT_TEST_SUPABASE_KEY=$(echo "$status" | grep '^ANON_KEY=' | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "MEDOT_TEST_SUPABASE_SERVICE_KEY=$(echo "$status" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
      - name: Integration tests (RLS isolation, bootstrap, records)
        working-directory: runtime
        run: uv run --extra dev pytest tests/ -q

  supabase-hosted:
    name: Integration tests — hosted Supabase
    runs-on: ubuntu-latest
    env:
      MEDOT_TEST_SUPABASE_URL: ${{ secrets.MEDOT_TEST_SUPABASE_URL }}
      MEDOT_TEST_SUPABASE_KEY: ${{ secrets.MEDOT_TEST_SUPABASE_KEY }}
      MEDOT_TEST_SUPABASE_SERVICE_KEY: ${{ secrets.MEDOT_TEST_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Integration tests (RLS isolation against the hosted project)
        working-directory: runtime
        run: uv run --extra dev pytest tests/ -q

  desktop:
    name: Desktop compile + frontend build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust check
        working-directory: desktop/src-tauri
        run: cargo check

  release:
    name: Windows installer (CI-built — nothing builds on user machines)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Write bundled publishable config (from repo secrets)
        shell: pwsh
        run: |
          @'
          [supabase]
          supabase_url = "${{ secrets.MEDOT_SUPABASE_URL }}"
          publishable_key = "${{ secrets.MEDOT_SUPABASE_PUBLISHABLE_KEY }}"
          '@ | Out-File -Encoding utf8 desktop/src-tauri/binaries/config.toml
      - name: Build runtime sidecar (PyInstaller, config bundled)
        working-directory: runtime
        shell: pwsh
        run: >
          uv run --extra dev pyinstaller --onefile --name medot-runtime
          --collect-submodules uvicorn
          --add-data "../desktop/src-tauri/binaries/config.toml;."
          --distpath ../desktop/src-tauri/binaries
          --workpath build --specpath build --noconfirm run_runtime.py
      - name: Rename sidecar for the target triple
        working-directory: desktop/src-tauri/binaries
        shell: pwsh
        run: Copy-Item medot-runtime.exe medot-runtime-x86_64-pc-windows-msvc.exe -Force
      - name: Build installer (NSIS)
        working-directory: desktop
        run: npx tauri build --target x86_64-pc-windows-msvc
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medot-setup-windows
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
